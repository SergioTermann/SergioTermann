<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb" />
      <stop offset="100%" stop-color="#2575fc" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- 样式定义 -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap');
    
    text {
      font-family: 'Montserrat', sans-serif;
      fill: #333;
    }
    
    .timeline-line {
      stroke: url(#timelineGradient);
      stroke-width: 4;
      stroke-linecap: round;
    }
    
    .timeline-dot {
      fill: url(#timelineGradient);
      filter: url(#glow);
    }
    
    .timeline-card {
      fill: white;
      rx: 10;
      ry: 10;
      filter: url(#shadow);
      transition: transform 0.3s;
    }
    
    .timeline-card:hover {
      transform: scale(1.02);
    }
    
    .year-label {
      font-size: 16px;
      font-weight: 600;
      fill: #555;
    }
    
    .title-label {
      font-size: 18px;
      font-weight: 700;
      fill: #333;
    }
    
    .desc-label {
      font-size: 14px;
      font-weight: 400;
      fill: #666;
    }
    
    .badge {
      rx: 12;
      ry: 12;
    }
    
    .badge-text {
      font-size: 10px;
      font-weight: 600;
      fill: white;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    
    .education-badge {
      fill: #2575fc;
    }
    
    .internship-badge {
      fill: #6a11cb;
    }
    
    .research-badge {
      fill: #11998e;
    }
    
    .project-badge {
      fill: #f46b45;
    }
    
    .award-badge {
      fill: #f9d423;
    }
  </style>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="400" y="50" font-size="28" font-weight="700" text-anchor="middle">职业发展时间线</text>
  
  <!-- 时间线 -->
  <line class="timeline-line" x1="400" y1="100" x2="400" y2="950" />
  
  <!-- 2022-至今: 博士 -->
  <g transform="translate(0, 150)">
    <circle class="timeline-dot" cx="400" cy="0" r="10" />
    <rect class="timeline-card" x="420" y="-60" width="320" height="120" />
    <text class="year-label" x="440" y="-30">2022 - 至今</text>
    <text class="title-label" x="440" y="0">北京航空航天大学 - 博士</text>
    <text class="desc-label" x="440" y="30">自动化专业</text>
    <text class="desc-label" x="440" y="55">研究方向: 强化学习与机器人技术</text>
    
    <rect class="badge education-badge" x="700" y="-50" width="80" height="24" />
    <text class="badge-text" x="740" y="-38">EDUCATION</text>
  </g>
  
  <!-- 2020-2022: 中科院 -->
  <g transform="translate(0, 300)">
    <circle class="timeline-dot" cx="400" cy="0" r="10" />
    <rect class="timeline-card" x="60" y="-60" width="320" height="120" />
    <text class="year-label" x="80" y="-30">2020 - 2022</text>
    <text class="title-label" x="80" y="0">中国科学院自动化研究所</text>
    <text class="desc-label" x="80" y="30">人工智能竞赛与研究</text>
    <text class="desc-label" x="80" y="55">NIPS Aicrowd Procgen RL Challenge - 全球前10</text>
    
    <rect class="badge research-badge" x="80" y="-50" width="80" height="24" />
    <text class="badge-text" x="120" y="-38">RESEARCH</text>
  </g>
  
  <!-- 2019-2021: 硕士 -->
  <g transform="translate(0, 450)">
    <circle class="timeline-dot" cx="400" cy="0" r="10" />
    <rect class="timeline-card" x="420" y="-60" width="320" height="120" />
    <text class="year-label" x="440" y="-30">2019 - 2021</text>
    <text class="title-label" x="440" y="0">北京航空航天大学 - 硕士</text>
    <text class="desc-label" x="440" y="30">软件工程专业</text>
    <text class="desc-label" x="440" y="55">北京市优秀毕业生</text>
    
    <rect class="badge education-badge" x="700" y="-50" width="80" height="24" />
    <text class="badge-text" x="740" y="-38">EDUCATION</text>
  </g>
  
  <!-- 2019: 实习 -->
  <g transform="translate(0, 600)">
    <circle class="timeline-dot" cx="400" cy="0" r="10" />
    <rect class="timeline-card" x="60" y="-60" width="320" height="120" />
    <text class="year-label" x="80" y="-30">2019年6月 - 9月</text>
    <text class="title-label" x="80" y="0">北航软件学院</text>
    <text class="desc-label" x="80" y="30">自动驾驶项目</text>
    <text class="desc-label" x="80" y="55">算法研发与实现</text>
    
    <rect class="badge internship-badge" x="80" y="-50" width="80" height="24" />
    <text class="badge-text" x="120" y="-38">INTERNSHIP</text>
  </g>
  
  <!-- 2014-2018: 本科 -->
  <g transform="translate(0, 750)">
    <circle class="timeline-dot" cx="400" cy="0" r="10" />
    <rect class="timeline-card" x="420" y="-60" width="320" height="120" />
    <text class="year-label" x="440" y="-30">2014 - 2018</text>
    <text class="title-label" x="440" y="0">北京工业大学 - 本科</text>
    <text class="desc-label" x="440" y="30">测控技术与仪器专业</text>
    <text class="desc-label" x="440" y="55">优秀毕业论文</text>
    
    <rect class="badge education-badge" x="700" y="-50" width="80" height="24" />
    <text class="badge-text" x="740" y="-38">EDUCATION</text>
  </g>
  
  <!-- 2023-2024: 航空航天智能项目 -->
  <g transform="translate(0, 900)">
    <circle class="timeline-dot" cx="400" cy="0" r="10" />
    <rect class="timeline-card" x="60" y="-60" width="320" height="120" />
    <text class="year-label" x="80" y="-30">2023 - 2024</text>
    <text class="title-label" x="80" y="0">航空航天智能项目</text>
    <text class="desc-label" x="80" y="30">大规模并行强化学习</text>
    <text class="desc-label" x="80" y="55">多模态大模型训练</text>
    
    <rect class="badge project-badge" x="80" y="-50" width="80" height="24" />
    <text class="badge-text" x="120" y="-38">PROJECT</text>
  </g>
</svg>