<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb" />
      <stop offset="100%" stop-color="#2575fc" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff15" stroke-width="1" />
    </pattern>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

    text { font-family: 'Montserrat', sans-serif; fill: #e6edf3; }

    .timeline-line {
      stroke: url(#timelineGradient);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 8 10;
      animation: dashShift 12s linear infinite;
      filter: url(#glow);
    }

    @keyframes dashShift {
      to { stroke-dashoffset: 120; }
    }

    .timeline-dot { fill: url(#timelineGradient); filter: url(#glow); }

    .timeline-card {
      fill: #0b1320;
      stroke: #2d3b55;
      stroke-width: 1;
      rx: 12; ry: 12;
      filter: url(#shadow);
      transition: transform 0.25s ease-out;
    }
    .timeline-card:hover { transform: translateY(-3px) scale(1.01); }

    .year-label { font-size: 16px; font-weight: 600; fill: #9db2c9; }
    .title-label { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .desc-label { font-size: 14px; font-weight: 400; fill: #b5c3d6; }

    .badge { rx: 12; ry: 12; }
    .badge-text { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }

    .education-badge { fill: #2575fc; }
    .internship-badge { fill: #6a11cb; }
    .research-badge { fill: #11998e; }
    .project-badge { fill: #f46b45; }
    .award-badge { fill: #f9d423; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title -->
  <text x="400" y="52" font-size="28" font-weight="700" text-anchor="middle">Career Timeline</text>

  <!-- Timeline vertical line -->
  <line class="timeline-line" x1="400" y1="100" x2="400" y2="950" />
  
  <!-- 2022-Present: PhD -->
  <g transform="translate(0, 150)">
    <circle class="timeline-dot" cx="400" cy="0" r="10">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite" />
    </circle>
    <rect class="timeline-card" x="420" y="-60" width="320" height="120" />
    <text class="year-label" x="440" y="-30">2022 – Present</text>
    <text class="title-label" x="440" y="0">PhD in Automation — Beihang University (BUAA)</text>
    <text class="desc-label" x="440" y="30">Focus: Reinforcement Learning & Robotics</text>
    <text class="desc-label" x="440" y="55">Research on intelligent agents and control</text>

    <rect class="badge education-badge" x="700" y="-50" width="80" height="24" />
    <text class="badge-text" x="740" y="-38">EDUCATION</text>
  </g>
  
  <!-- 2020-2022: Chinese Academy of Sciences -->
  <g transform="translate(0, 300)">
    <circle class="timeline-dot" cx="400" cy="0" r="10">
      <animate attributeName="r" values="10;13;10" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <rect class="timeline-card" x="60" y="-60" width="320" height="120" />
    <text class="year-label" x="80" y="-30">2020 – 2022</text>
    <text class="title-label" x="80" y="0">Chinese Academy of Sciences — Institute of Automation</text>
    <text class="desc-label" x="80" y="30">AI Competitions & Research</text>
    <text class="desc-label" x="80" y="55">Procgen RL Challenge — Global Top 10 (NeurIPS 2020)</text>

    <rect class="badge research-badge" x="80" y="-50" width="90" height="24" />
    <text class="badge-text" x="125" y="-38">RESEARCH</text>
  </g>
  
  <!-- 2019-2021: Master’s Degree -->
  <g transform="translate(0, 450)">
    <circle class="timeline-dot" cx="400" cy="0" r="10">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite" />
    </circle>
    <rect class="timeline-card" x="420" y="-60" width="320" height="120" />
    <text class="year-label" x="440" y="-30">2019 – 2021</text>
    <text class="title-label" x="440" y="0">Master of Engineering — Beihang University (BUAA)</text>
    <text class="desc-label" x="440" y="30">Software Engineering</text>
    <text class="desc-label" x="440" y="55">Outstanding Graduate — Beijing</text>

    <rect class="badge education-badge" x="700" y="-50" width="80" height="24" />
    <text class="badge-text" x="740" y="-38">EDUCATION</text>
  </g>
  
  <!-- 2019: Internship -->
  <g transform="translate(0, 600)">
    <circle class="timeline-dot" cx="400" cy="0" r="10">
      <animate attributeName="r" values="10;13;10" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <rect class="timeline-card" x="60" y="-60" width="320" height="120" />
    <text class="year-label" x="80" y="-30">Jun – Sep 2019</text>
    <text class="title-label" x="80" y="0">Beihang Software Institute</text>
    <text class="desc-label" x="80" y="30">Autonomous Driving Project</text>
    <text class="desc-label" x="80" y="55">Algorithm development & integration</text>

    <rect class="badge internship-badge" x="80" y="-50" width="90" height="24" />
    <text class="badge-text" x="125" y="-38">INTERNSHIP</text>
  </g>
  
  <!-- 2014-2018: Bachelor’s Degree -->
  <g transform="translate(0, 750)">
    <circle class="timeline-dot" cx="400" cy="0" r="10">
      <animate attributeName="r" values="10;13;10" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <rect class="timeline-card" x="420" y="-60" width="320" height="120" />
    <text class="year-label" x="440" y="-30">2014 – 2018</text>
    <text class="title-label" x="440" y="0">Bachelor of Engineering — Beijing University of Technology</text>
    <text class="desc-label" x="440" y="30">Measurement & Control Technology and Instruments</text>
    <text class="desc-label" x="440" y="55">Outstanding Thesis</text>

    <rect class="badge education-badge" x="700" y="-50" width="80" height="24" />
    <text class="badge-text" x="740" y="-38">EDUCATION</text>
  </g>
  
  <!-- 2024: Aerospace Intelligence Project -->
  <g transform="translate(0, 900)">
    <circle class="timeline-dot" cx="400" cy="0" r="10">
      <animate attributeName="r" values="10;13;10" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <rect class="timeline-card" x="60" y="-60" width="320" height="120" />
    <text class="year-label" x="80" y="-30">Apr – Oct 2024</text>
    <text class="title-label" x="80" y="0">Aerospace Intelligence Project</text>
    <text class="desc-label" x="80" y="30">Large-Scale Parallel Reinforcement Learning</text>
    <text class="desc-label" x="80" y="55">Multi-Modal Large Model Training</text>

    <rect class="badge project-badge" x="80" y="-50" width="90" height="24" />
    <text class="badge-text" x="125" y="-38">PROJECT</text>
  </g>
</svg>